<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BottomSheetManager Demos</title>

    <!-- فونت وزیرمتن از گوگل فونت -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body, button, h1, p {
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif !important;
        }

        body {
            background-color: #f4f6f8;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .welcome-card {
            background: #fff;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #111;
            margin-bottom: 12px;
        }

        p.desc {
            color: #666;
            font-size: 15px;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .buttons-wrapper {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        a.demo-link {
            flex: 1;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 10px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        a.demo-link:hover {
            background: #1d4ed8;
        }

        a.demo-link:active {
            transform: scale(0.98);
        }

        a.demo-link.en {
            background: #475569;
            box-shadow: 0 4px 12px rgba(71, 85, 105, 0.2);
        }

        a.demo-link.en:hover {
            background: #334155;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>BottomSheetManager Demos</h1>
        <p class="desc">لطفاً زبان مورد نظر خود را برای مشاهده دموی کتابخانه انتخاب کنید:<br>Please select your preferred language to view the demo:</p>

        <div class="buttons-wrapper">
            <a href="BottomSheetManager-Fa.html" class="demo-link">نسخه فارسی (Fa)</a>
            <a href="BottomSheetManager-En.html" class="demo-link en">English Version</a>
        </div>
    </div>

</body>
</html>
